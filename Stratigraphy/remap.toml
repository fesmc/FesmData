# Englacial stratigraphy and age structure (thematic dataset, see ../Remap/DATASETS.md).
# Products are written as <GRID>_Stratigraphy-<name>.nc on their `grids`; see ../GHF/remap.toml for the options. The dataset and its release tag are
# in ../Publish/datasets.toml.

[products.MacGregor2025]
source = "MacGregor2025_strat"
file = "MacGregor2025_STRAT.nc"
variables = ["ice_age", "ice_age_sd", "depth_iso", "depth_iso_sd"]
grids = { GreenlandPaleo = 4, Greenland = 4 }   # Greenland too: its own record, also in mirrors (not only by cropping)
