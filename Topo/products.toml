# Products of the topography v2 pipeline on each domain (see ../shared/domains.toml).
#
# `products` maps each output product name to its sources, in order of priority (see
# sources.jl); a thickness source (glaciers) adds ice onto the sources below it.
# `products` are the default products of a domain, from the latest sources; `variants`
# are further products from earlier versions or other sources, made on request.
# `rho_ice` and `rho_sw` (kg m-3) are used for flotation, as in the BedMachine product
# of the domain.

[ANT]
rho_ice = 917.0
rho_sw = 1027.0

[ANT.products]
"BedMachine-v4" = ["bedmachine_antarctica_v4", "gebco2026"]
"Bedmap3" = ["bedmap3", "gebco2026"]

[ANT.variants]
"BedMachine-v3" = ["bedmachine_antarctica_v3", "gebco2026"]
"BedMachine-v2" = ["bedmachine_antarctica_v2", "gebco2026"]
"Bedmap2" = ["bedmap2", "gebco2026"]

[GRL-PAL]
rho_ice = 917.0
rho_sw = 1023.0

[GRL-PAL.products]
"BedMachine-v6" = ["bedmachine_greenland_v6", "gebco2026"]

[GRL-PAL.variants]
"BedMachine-v5" = ["bedmachine_greenland_v5", "gebco2026"]
"BedMachine-v4" = ["bedmachine_greenland_v4", "gebco2026"]

[NH]
rho_ice = 917.0
rho_sw = 1023.0

[NH.products]
"GEBCO2026" = ["bedmachine_greenland_v6", "iceboost_v2", "gebco2026"]

# Mountain glaciers: GEBCO 2026 with the IceBoost glaciers (RGI 11 Central Europe, RGI
# 17 Southern Andes). No BedMachine product sets the densities: rho_sw is that of
# Yelmo (yelmo_phys_const.nml).
[PYR]
rho_ice = 917.0
rho_sw = 1028.0

[PYR.products]
"GEBCO2026" = ["iceboost_v2", "gebco2026"]

[SRG]
rho_ice = 917.0
rho_sw = 1028.0

[SRG.products]
"GEBCO2026" = ["iceboost_v2", "gebco2026"]
