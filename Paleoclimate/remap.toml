# Paleoclimate: climate model simulations and reconstructions of past climates
# (thematic dataset, see ../Remap/README.md). Products are written as
# <GRID>_Paleoclimate-<name>.nc on every grid of their `domains`; see ../GHF/remap.toml
# for the options. The dataset and its release tag are in ../Publish/datasets.toml.

[products.PMIP3-CCSM4-lgm]
source = "PMIP3_cvdp"
file = "PMIP3_CCSM4_lgm.nc"
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]
min_spacing_km = 8

[products.PMIP3-CCSM4-midHolocene]
source = "PMIP3_cvdp"
file = "PMIP3_CCSM4_midHolocene.nc"
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]
min_spacing_km = 8

