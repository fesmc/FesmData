# Paleoclimate: climate model simulations and reconstructions of past climates
# (thematic dataset, see ../Remap/DATASETS.md). Products are written as
# <GRID>_Paleoclimate-<name>.nc on their `grids`; see ../GHF/remap.toml
# for the options. The dataset and its release tag are in ../Publish/datasets.toml.
# The ensemble products (`ensemble`) are the mean and standard deviation of the models
# of PMIP3 and of PMIP4 for each experiment. The website shows the LGM of each model and
# the LGM ensemble means only (figure = false for the others).

[products.PMIP3-CCSM4-lgm]
source = "PMIP3_cvdp"
file = "PMIP3_CCSM4_lgm.nc"
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["t2m_ann"] }

[products.PMIP3-CCSM4-midHolocene]
source = "PMIP3_cvdp"
