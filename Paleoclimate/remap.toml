# Paleoclimate: climate model simulations and reconstructions of past climates
# (thematic dataset, see ../Remap/DATASETS.md). Products are written as
# <GRID>_Paleoclimate-<name>.nc on their `grids`; see ../GHF/remap.toml
# for the options. The dataset and its release tag are in ../Publish/datasets.toml.
# PMIP3 and PMIP4: one product per model and experiment (atmosphere), and one with
# -ocean (sea surface temperature, sea ice, ocean temperature) where the run published
# ocean fields. The ensemble products (`ensemble`) are the mean and standard deviation of
# the models of PMIP3 and of PMIP4 for each experiment (lgm without CESM2-FV2, the
# PaleoCalibr LGM run itself, without pr), and PMIP-lgm of both (without CNRM-CM5, whose LGM
# run has no ice surface, and the CESM2-FV2 runs: the LGM reference of the kryos bias
# correction). The website shows the LGM of each model and the LGM ensemble means only
# (figure = false for the others).

[products.PMIP3-bcc-csm1-1-midHolocene]
source = "PMIP3_cmip5"
file = "PMIP3_bcc-csm1-1_midHolocene.nc"
grids = { Antarctica = 16, GreenlandPaleo = 16, PatagoniaPaleo = 8, North = 16, Global = 50 }
figure = false

[products.PMIP3-bcc-csm1-1-midHolocene-ocean]
source = "PMIP3_cmip5"
file = "PMIP3_bcc-csm1-1_midHolocene_ocean.nc"
mask = { mask_ocn = 0.5 }   # ocean where mostly ocean (land and sea floor are missing)
grids = { Antarctica = 16, GreenlandPaleo = 16, PatagoniaPaleo = 8, North = 16, Global = 50 }
figure = false

