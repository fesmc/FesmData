project:
  type: website
  output-dir: _site
  resources:
    - "figures/**/*.png"   # all figures, also those only linked (e.g. figures/Domains)
  render:
    - "index.qmd"
    - "download.qmd"
    - "products.qmd"
    - "domains.qmd"
    - "datasets.qmd"
    - "precision.qmd"
    - "datasets/*.qmd"
    - "records_overview.qmd"
    - "remap.qmd"
    - "records.qmd"
    - "developers.qmd"
    - "machines.qmd"
    - "adding.qmd"
    - "releasing.qmd"
    - "website.qmd"

website:
  title: "FesmData"
  description: "Processed datasets for ice-sheet and Earth-system models, on the grids of each model domain."
  site-url: "https://fesmc.github.io/FesmData/"
  repo-url: "https://github.com/fesmc/FesmData"
  repo-actions: [issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Download"
        href: download.qmd
      - text: "Products"
        href: products.qmd
      - text: "Domains"
        href: domains.qmd
      - text: "Datasets"
        menu:
          - text: "Overview"
            href: datasets.qmd
          - text: "Precision and file sizes"
            href: precision.qmd
          - text: "---"
          - text: "Topography and masks"
          - text: "Topo — topography"
            href: datasets/topo.qmd
          - text: "Regions — regions and basins"
            href: datasets/regions.qmd
          - text: "---"
          - text: "Ice"
          - text: "Velocity — ice surface velocity"
            href: datasets/velocity.qmd
          - text: "IceChange — observed ice sheet change"
            href: datasets/icechange.qmd
          - text: "IceHistory — paleo ice sheets"
            href: datasets/icehistory.qmd
          - text: "Stratigraphy — age structure"
            href: datasets/stratigraphy.qmd
          - text: "BasalMelt — ice-shelf melt"
            href: datasets/basalmelt.qmd
          - text: "BasalState — basal thermal state"
            href: datasets/basalstate.qmd
          - text: "---"
          - text: "Solid Earth"
          - text: "GHF — geothermal heat flow"
            href: datasets/ghf.qmd
          - text: "Sediment — sediment thickness"
            href: datasets/sediment.qmd
          - text: "SolidEarth — lithosphere and mantle"
            href: datasets/solidearth.qmd
          - text: "---"
          - text: "Ocean and climate"
          - text: "Ocean — temperature and salinity"
            href: datasets/ocean.qmd
          - text: "SMB — surface mass balance"
            href: datasets/smb.qmd
          - text: "Atmosphere — reanalysis and satellite"
            href: datasets/atmosphere.qmd
          - text: "Paleoclimate — past climates"
            href: datasets/paleoclimate.qmd
      - text: "Records"
        menu:
          - text: "Overview"
            href: records_overview.qmd
          - text: "---"
          - text: "IceCores — ice core records"
            href: datasets/icecores.qmd
          - text: "GHG — greenhouse gases"
            href: datasets/ghg.qmd
          - text: "SeaLevel — global sea level"
            href: datasets/sealevel.qmd
          - text: "Stacks — benthic δ18O stacks"
            href: datasets/stacks.qmd
          - text: "RSL — relative sea level"
            href: datasets/rsl.qmd
          - text: "Boreholes — ice temperature profiles"
            href: datasets/boreholes.qmd
          - text: "GPS — vertical velocities"
            href: datasets/gps.qmd
          - text: "SMBObs — surface mass balance observations"
            href: datasets/smbobs.qmd
          - text: "Freshwater — ice sheet freshwater fluxes"
            href: datasets/freshwater.qmd
      - text: "Your own data"
        menu:
          - text: "Gridded data"
            href: remap.qmd
          - text: "Records format"
            href: records.qmd
      - text: "Developers"
        menu:
          - text: "Overview and code"
            href: developers.qmd
          - text: "Machines and storage"
            href: machines.qmd
          - text: "Adding a dataset"
            href: adding.qmd
          - text: "Releasing"
            href: releasing.qmd
          - text: "Website and figures"
            href: website.qmd
    right:
      - icon: github
        href: "https://github.com/fesmc/FesmData"
        aria-label: GitHub
        target: _blank
  page-footer:
    left: "FesmData · fesmc"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    lightbox: true
    link-external-newwindow: true
    include-after-body:
      # "Report an issue" (repo-actions), which link-external-newwindow leaves out
      text: |
        <script>document.querySelectorAll('a.toc-action[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });</script>
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
