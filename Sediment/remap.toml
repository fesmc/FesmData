# Sediment thickness (thematic dataset, see ../Remap/README.md).
#
# Each table of `products` is a product, written as <GRID>_Sediment-<name>.nc on its `grids` (by domain), from the prepared file `file` of the source
# `source` (made by <source>/prepare.jl in $FESMDATA_WORK/prepared/<source>/). See
# ../GHF/remap.toml for the options. The dataset and its release tag are in
# ../Publish/datasets.toml.

[products.CRUST1]
source = "Laske2013_crust1"
file = "Laske2013_CRUST1_sed.nc"
variables = ["z_sed", "z_sed_upper", "z_sed_middle", "z_sed_lower"]
grids = { Antarctica = 4, GreenlandPaleo = 4, North = 4, Global = 4 }

[products.GlobSed]
source = "Straume2019_globsed"
file = "Straume2019_GlobSed.nc"
variables = ["z_sed"]
grids = { Antarctica = 4, GreenlandPaleo = 4, North = 4, Global = 4 }

[products.ECM1]
source = "Mooney2023_ecm1"
file = "Mooney2023_ECM1_sed.nc"
variables = ["z_sed", "z_sed_upper", "z_sed_middle", "z_sed_lower"]
grids = { Antarctica = 4, GreenlandPaleo = 4, North = 4, Global = 4 }

[products.ANTASed]
source = "Baranov2021_sed"
file = "Baranov2021_ANTASed.nc"
variables = ["z_sed"]
grids = { Antarctica = 4 }

[products.Gowan2019]
source = "Gowan2019_sed"
file = "Gowan2019_sed.nc"
variables = ["grain", "distribution", "composite"]
grids = { GreenlandPaleo = 4, Laurentide = 4 }
