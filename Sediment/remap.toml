# Sediment thickness (thematic dataset, see ../Remap/README.md).
#
# Each table of `products` is a product, written as <GRID>_Sediment-<name>.nc on every
# grid of its `domains` (output folders), from the prepared file `file` of the source
# `source` (made by <source>/prepare.jl in $FESMDATA_WORK/prepared/<source>/). See
# ../GHF/remap.toml for the options. The dataset and its release tag are in
# ../Publish/datasets.toml.

[products.CRUST1]
source = "Laske2013_crust1"
file = "Laske2013_CRUST1_sed.nc"
variables = ["z_sed", "z_sed_upper", "z_sed_middle", "z_sed_lower"]
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]
min_spacing_km = 4

[products.GlobSed]
source = "Straume2019_globsed"
file = "Straume2019_GlobSed.nc"
variables = ["z_sed"]
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]
min_spacing_km = 4
