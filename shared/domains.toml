# Model domains shared by all FesmData pipelines (Topo, Regions, ...).
#
# Each domain has a base grid at its finest resolution, `resolutions[1]` (km). All
# other grids, at the remaining resolutions and for the crops, are derived from the
# base grid by coarsening (and cropping), so all grids of a domain are nested. Extents
# (km) are the first and last cell centres of the base grid, and follow the v1 grids
# in maps/ where there are any, so all grids share their first cell centre.
#
# `proj` is a polar stereographic or transverse Mercator (e.g. UTM) PROJ string in km
# (false easting and northing in m, as in PROJ).
#
# `folder` is the output folder under $ICE_DATA/v2, and the name of the domain (or
# crop) in published records, unique to each.
#
# A crop (`[<KEY>.crops.<CROP>]`) is a part of the grids of its domain, at all its
# resolutions or at those in its own `resolutions`. A nest (`[<KEY>.nests.<NEST>]`) is
# a domain of its own on the projection of its parent, with a base grid finer than
# that of the parent, made from the sources: at the resolutions it shares with its
# parent, its grids lie on those of the parent (same cell centres).
#
# A domain with `active = false` (nests: as their parent, unless set) is defined but
# left out of the releases, figures and the products made for all domains; its grids
# and products are made only when it is named.
#
# A domain with `type = "lonlat"` has global lon-lat grids instead, one per resolution
# (degrees), independent of each other (GLOBAL-0.5DEG, ...). `gaussian` adds Gaussian
# grids by spectral truncation and number of latitudes (GLOBAL-T170, 512 x 256), which
# are made only for the products that name them (see ../Remap/README.md).

[GLOBAL]
folder = "Global"
type = "lonlat"
resolutions = [0.1, 0.25, 0.5, 1, 2, 5]
gaussian = { T170 = 256 }

[ANT]
folder = "Antarctica"
proj = "+proj=stere +lat_0=-90 +lat_ts=-71 +lon_0=0 +x_0=0 +y_0=0 +a=6378137 +rf=298.25722356 +units=km"
xlim = [-3040, 3040]
ylim = [-3040, 3040]
resolutions = [1, 2, 4, 8, 16, 32]

[GRL-PAL]
folder = "GreenlandPaleo"
proj = "+proj=stere +lat_0=90 +lat_ts=70 +lon_0=-45 +x_0=0 +y_0=0 +a=6378137 +rf=298.25722356 +units=km"
xlim = [-1360, 960]
ylim = [-3450, -570]
resolutions = [0.5, 1, 2, 4, 8, 16, 32]

[GRL-PAL.crops.GRL]
folder = "Greenland"
xlim = [-720, 960]
ylim = [-3450, -570]

[NH]
folder = "North"
proj = "+proj=stere +lat_0=90 +lat_ts=70 +lon_0=-45 +x_0=0 +y_0=0 +a=6378137 +rf=298.25722356 +units=km"
xlim = [-4900, 3900]
ylim = [-5400, 3400]
resolutions = [2, 4, 8, 16, 32]

[NH.crops.LIS]
folder = "Laurentide"
xlim = [-4900, -36]
ylim = [-5400, 1576]

[NH.crops.EIS]
folder = "Eurasia"
xlim = [380, 3900]
ylim = [-5000, 1400]

# ---------------------------------------------------------------------------
# Mountain glaciers: base grids of 250 m (500 m for Svalbard), and 50 m for the nests
# of single icefields. Each domain is on the projection used for glacier modelling in
# its region, and covers the extent of its glaciers at the Last Glacial Maximum.
# ---------------------------------------------------------------------------

# Pyrenees (no v1 grid): UTM zone 31N (EPSG:32631), 1.8W-2.85E, 41.8-43.45N (1520 x
# 688 cells at 250 m): the range and its glaciers, without the coastal ends (Bay of
# Biscay, Cap de Creus).
[PYR]
folder = "Pyrenees"
proj = "+proj=tmerc +lat_0=0 +lon_0=3 +k=0.9996 +x_0=500000 +y_0=0 +a=6378137 +rf=298.257223563 +units=km"
xlim = [107.875, 487.625]
ylim = [4639.875, 4811.625]
resolutions = [0.25, 0.5]

# Patagonia: UTM zone 18S (EPSG:32718), as the v1 SRG grids, from 38S to Cape Horn
# (56.5S) and from 77W to 65W (the Patagonian Ice Sheet), with the cell centres of the
# v1 SRG-250M grid. Crops: the Northern and Southern Patagonian Icefields. Nests (50,
# 100 and 250 m): the San Rafael Glacier (SRG, the extent of the v1 SRG-250M grid,
# which its 250 m grid reproduces), Gran Campo Nevado and the Cordillera Darwin
# Icefield.
[PAT]
folder = "Patagonia"
proj = "+proj=tmerc +lat_0=0 +lon_0=-75 +k=0.9996 +x_0=500000 +y_0=10000000 +a=6378137 +rf=298.257223563 +units=km"
xlim = [324.087171469987, 1379.087171469987]
ylim = [3693.102314639904, 5794.602314639904]
resolutions = [0.25, 0.5]

# 46.3-47.8S, 74.2-72.7W
[PAT.crops.NPI]
folder = "NorthPatagonianIcefield"
xlim = [559.837171469987, 677.337171469987]
ylim = [4703.352314639904, 4872.352314639904]
resolutions = [0.25]

# 48.2-51.7S, 74.7-72.6W
[PAT.crops.SPI]
folder = "SouthPatagonianIcefield"
xlim = [520.587171469987, 678.337171469987]
ylim = [4269.352314639904, 4661.602314639904]
resolutions = [0.25]

[PAT.nests.SRG]
folder = "SRG"
xlim = [583.087171469987, 634.837171469987]
ylim = [4811.102314639904, 4840.852314639904]
resolutions = [0.05, 0.1, 0.25]

# 52.55-53.05S, 73.55-72.65W
[PAT.nests.GCN]
folder = "GranCampoNevado"
xlim = [597.087171469987, 659.587171469987]
ylim = [4119.102314639904, 4177.102314639904]
resolutions = [0.05, 0.1, 0.25]

# 54.25-55.05S, 71.3-68.7W
[PAT.nests.CDI]
folder = "CordilleraDarwin"
xlim = [736.087171469987, 910.587171469987]
ylim = [3881.102314639904, 3982.602314639904]
resolutions = [0.05, 0.1, 0.25]

# Alps: UTM zone 32N (EPSG:32632), as the glacial-cycle simulations of Seguinot et al.
# (2018), 4-17.5E, 43-48.8N (the Lyon lobe in the west, the Po plain in the south).
[ALP]
folder = "Alps"
active = false
proj = "+proj=tmerc +lat_0=0 +lon_0=9 +k=0.9996 +x_0=500000 +y_0=0 +a=6378137 +rf=298.257223563 +units=km"
xlim = [92, 1193]
ylim = [4760, 5441]
resolutions = [0.25, 0.5]

# Himalaya, Karakoram and Hindu Kush: Albers equal-area conic of the High Mountain Asia
# glacier products (Shean et al., 2020), 68-99E, 25.5-38.5N.
[HIM]
folder = "Himalaya"
active = false
proj = "+proj=aea +lat_1=25 +lat_2=47 +lat_0=36 +lon_0=85 +x_0=0 +y_0=0 +a=6378137 +rf=298.257223563 +units=km"
xlim = [-1699, 1401]
ylim = [-1179, 407]
resolutions = [0.25, 0.5]

# Svalbard: UTM zone 33N (EPSG:32633), as the Norwegian Polar Institute, 5-35E,
# 74-81.5N (the archipelago and its shelf).
[SVB]
folder = "Svalbard"
active = false
proj = "+proj=tmerc +lat_0=0 +lon_0=15 +k=0.9996 +x_0=500000 +y_0=0 +a=6378137 +rf=298.257223563 +units=km"
xlim = [193, 1105]
ylim = [8212, 9106]
resolutions = [0.5, 1]

# New Zealand: New Zealand Transverse Mercator 2000 (EPSG:2193, GRS80), 166-175E,
# 40-47.5S (the South Island and its shelf).
[NZ]
folder = "NewZealand"
active = false
proj = "+proj=tmerc +lat_0=0 +lon_0=173 +k=0.9996 +x_0=1600000 +y_0=10000000 +a=6378137 +rf=298.257222101 +units=km"
xlim = [1002, 1771]
ylim = [4715, 5573]
resolutions = [0.25, 0.5]
