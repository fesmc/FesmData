name: Publish docs

# Render the Quarto site in docs/ and publish it to the gh-pages branch, on every push
# to main that changes the docs, the READMEs they include, the registry (the products
# page, generated by `julia fesmdata.jl docs`) or Publish. The build needs Julia (standard
# library only) and Quarto. The figures are not in main: they are kept on gh-pages
# (Figures/publish_figures.sh), taken from there for the build, and gh-pages is
# published as a single commit, so that they are not versioned.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "registry/**"
      - "Publish/**"
      - "shared/README.md"
      - "*/README.md"
      - "fesmdata.jl"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - name: Products page
        run: julia fesmdata.jl docs

      - name: Figures from the site
        run: |
          git fetch --depth 1 origin gh-pages
          git archive FETCH_HEAD figures | tar -x -C docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - name: Publish to gh-pages (one commit)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          force_orphan: true
          commit_message: "Built site"
