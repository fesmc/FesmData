name: Publish docs

# Render the Quarto site in docs/ and publish it to the gh-pages branch, on every push
# to main that changes the docs, the READMEs they include, the registry (the products
# page, generated by `julia fesmdata.jl docs`) or Publish. The build needs Julia (standard
# library only) and Quarto.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "registry/**"
      - "Publish/**"
      - "shared/README.md"
      - "*/README.md"
      - "fesmdata.jl"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - name: Products page
        run: julia fesmdata.jl docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
