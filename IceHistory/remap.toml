# Paleo ice-sheet and topography reconstructions (thematic dataset, see
# ../Remap/DATASETS.md). Products are written as <GRID>_IceHistory-<name>.nc on their `grids`; see ../GHF/remap.toml for the options. The dataset and its
# release tag are in ../Publish/datasets.toml.

[products.ICE5G]
source = "Peltier2004_ice5g"
file = "Peltier2004_ICE5G.nc"
variables = ["z_topo", "H_ice", "f_ice"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.ICE6G_C]
source = "Peltier2015_ice6g"
file = "Peltier2015_ICE6G_C.nc"
variables = ["z_topo", "z_srf", "dz_topo", "H_ice", "f_ice", "f_land"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.PRISM4]
source = "Dowsett2016_prism4"
file = "Dowsett2016_PRISM4.nc"
variables = ["z_topo_enh", "z_topo_std", "z_topo_mod", "mask_enh", "mask_std"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }

[products.Batchelor2019]
source = "Batchelor2019_NHIceMasks"
file = "Batchelor2019_NH_ICE.nc"
variables = ["f_ice_best", "f_ice_min", "f_ice_max"]
grids = { GreenlandPaleo = 2, North = 2 }
figure = { select = { time = [140000, 65000, 26500] } }   # MIS 6, MIS 4, LGM

[products.PaleoMIST]
source = "Gowan2021_PaleoMIST1.0"
file = "Gowan2021_PaleoMIST.nc"
variables = ["z_topo", "z_bed", "H_ice", "dz_sl", "f_ice"]
grids = { Antarctica = 8, GreenlandPaleo = 8, North = 8, Global = 25 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.PaleoMIST_max]
source = "Gowan2021_PaleoMIST1.0"
file = "Gowan2021_PaleoMIST_max.nc"
variables = ["z_topo", "z_bed", "H_ice", "dz_sl", "f_ice"]
grids = { Antarctica = 8, GreenlandPaleo = 8, North = 8, Global = 25 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

# GLAC-1D: global for PMIP4 (26-0 ka), with the ice thickness on a finer grid of its own;
# and the regional reconstructions (120-0 ka) of North America + Greenland (two variants)
# and Antarctica, without Eurasia (f_valid = 0 outside them)
[products.GLAC1D]
source = "Tarasov2012_glac1d"
file = ["Tarasov2012_GLAC1D_PMIP4_topo.nc", "Tarasov2012_GLAC1D_PMIP4_ice.nc"]
variables = ["z_topo", "z_srf", "H_ice", "f_ice"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.GLAC1D_nn9927]
source = "Tarasov2012_glac1d"
file = ["Tarasov2012_GLAC1D_NA_nn9927.nc", "Tarasov2012_GLAC1D_ANT_nn4041.nc"]
variables = ["H_ice", "H_lake"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.GLAC1D_nn9894]
source = "Tarasov2012_glac1d"
file = ["Tarasov2012_GLAC1D_NA_nn9894.nc", "Tarasov2012_GLAC1D_ANT_nn4041.nc"]
variables = ["H_ice"]
grids = { Antarctica = 16, GreenlandPaleo = 16, North = 16, Global = 50 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }

[products.PaleoGrIS]
source = "Leger2024_PaleoGris"
file = "Leger2024_PaleoGrIS.nc"
variables = ["age_deglac", "age_deglac_err"]
grids = { GreenlandPaleo = 1 }

[products.Margold2015]
source = "Margold2015_icestreams"
file = "Margold2015_ICESTREAMS.nc"
variables = ["f_stream", "f_stream_lgm", "age_stream_start", "age_stream_end"]
grids = { North = 0 }

[products.Batchelor2019_PaleoMIST_LGC]
source = "Batchelor2019_PaleoMIST_lgc"
file = "Batchelor2019_PaleoMIST_LGC.nc"
variables = ["f_ice_best", "f_ice_min", "f_ice_max"]
grids = { Global = 0 }

[products.ICE6G_D]
source = "Peltier2018_ice6gd"
file = "Peltier2018_ICE6G_D.nc"
variables = ["H_ice", "H_ice_grounded", "z_topo"]
grids = { Antarctica = 8 }
figure = { variables = ["H_ice"], hide = 0, colormap = "ice" }
