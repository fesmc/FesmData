# Surface mass balance and surface climate from regional climate models (thematic
# dataset, see ../Remap/README.md). Products are written as <GRID>_SMB-<name>.nc on
# their `grids`; see ../GHF/remap.toml for the options. The dataset and
# its release tag are in ../Publish/datasets.toml. <name>-annual-mean: the annual mean
# (x, y) of the monthly climatology <name>.

[products."RACMO2.4p1-1981-2010"]
source = "vanDalum2025_racmo24"
file = "RACMO2.4p1_1981-2010.nc"
grids = { Antarctica = 4 }
figure = { variables = ["smb"] }

[products."RACMO2.4p1-1981-2010-annual-mean"]
source = "vanDalum2025_racmo24"
file = "RACMO2.4p1_1981-2010_annual-mean.nc"
grids = { Antarctica = 4 }
figure = false

[products."RACMO2.4p1-1991-2020"]
source = "vanDalum2025_racmo24"
file = "RACMO2.4p1_1991-2020.nc"
grids = { Antarctica = 4 }
