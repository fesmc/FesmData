[products."RACMO2.4p1-1991-2020-annual-mean"]
source = "vanDalum2025_racmo24"
file = "RACMO2.4p1_1991-2020_annual-mean.nc"
grids = { Antarctica = 4 }
figure = false

[products."RACMO2.4p1-annual"]
source = "vanDalum2025_racmo24"
file = "RACMO2.4p1_annual_1979-2023.nc"
grids = { Antarctica = 4 }
figure = { variables = ["smb"] }

# Filled outside the glaciated surfaces and the RACMO domain (harmonic interpolation), for
# model forcing over the whole grid
[products."RACMO2.3p2-1981-2010"]
source = "vanWessem2023_racmo23"
file = "RACMO2.3p2_1981-2010.nc"
grids = { Antarctica = 4 }
figure = { variables = ["smb"] }
fill = { variables = ["smb", "pr", "sf", "t2m", "T_srf", "z_srf"], mask = "all" }

[products."RACMO2.3p2-1981-2010-annual-mean"]
