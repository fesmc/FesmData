doi = "10.1594/PANGAEA.895889"
extract = true
uri = "https://hs.pangaea.de/Maps/NAGS/geology_for_ice_sheet_models.zip"

# ANTASed (Baranov et al., 2021): sediment thickness of the Antarctic continent, 0.1°
