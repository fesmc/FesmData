# Ice-sheet drainage basins.
# Zwally et al. (2012), GSFC: full drainage systems of Antarctica (incl. floating ice)
# and Greenland (with sub-systems), as lat/lon outlines.

[zwally2012_antarctica]
storage_path = "$datasets_dir/zwally2012/ant_full_drainagesystem_polygons.txt"
uri = "https://earth.gsfc.nasa.gov/sites/default/files/lab_cryo/data/polar_ice_altimetry/antarctic_and_greenland_drainage_systems/ant_full_drainagesystem_polygons.txt"

[zwally2012_greenland]
storage_path = "$datasets_dir/zwally2012/grndrainagesystems_ekholm.txt"
uri = "https://earth.gsfc.nasa.gov/sites/default/files/lab_cryo/data/polar_ice_altimetry/antarctic_and_greenland_drainage_systems/grndrainagesystems_ekholm.txt"

# Mouginot & Rignot (2019): 260 Greenland glacier basins in 7 regions (shapefile).
# Manual download (Dryad), all Greenland_Basins_PS_v1.4.2.* files into the folder.

[mouginot2019_greenland_basins]
doi = "10.7280/D1WT11"
skip_download = true
storage_path = "$datasets_dir/mouginot2019_greenland_basins"
uri = "https://datadryad.org/dataset/doi:10.7280/D1WT11"

# MEaSUREs Antarctic Boundaries v2 (NSIDC-0709): IMBIE 2016 basins and the refined
# basins (shapefiles). Manual download (NASA Earthdata login), the .shp, .shx, .dbf
# and .prj files of Basins_IMBIE_Antarctica_v02 and Basins_Antarctica_v02 into the
# folder, from the uri below.

[nsidc0709_v2_basins]
doi = "10.5067/AXE4121732AD"
skip_download = true
storage_path = "$datasets_dir/nsidc0709_v2_basins"
uri = "https://data.nsidc.earthdatacloud.nasa.gov/nsidc-cumulus-prod-protected/MEASURES/NSIDC-0709/2/1992/02/07/"

# ISO 3166 countries with their UN M49 regions (lukes/ISO-3166-Countries-with-Regional-
# Codes, pinned commit), to group the territories of the EEZ-land union by continent.

[iso3166_m49]
storage_path = "$datasets_dir/iso3166_m49/all.csv"
uri = "https://raw.githubusercontent.com/lukes/ISO-3166-Countries-with-Regional-Codes/145f1ad3caff212ed25f42b0ee2c8b92a75af895/all/all.csv"
