# Regions v2 (see Regions/README.md)

# Marine Regions (Flanders Marine Institute), from its WFS server as zipped shapefiles:
# IHO Sea Areas v3 (doi:10.14284/323), Global Oceans and Seas v1 (doi:10.14284/542),
# union of world country boundaries and EEZs v4 (EEZ v12, doi:10.14284/698).

[marineregions_iho_v3]
key = "marineregions_iho_v3.zip"
doi = "10.14284/323"
extract = true
uri = "https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=MarineRegions:iho&outputFormat=SHAPE-ZIP"

[marineregions_goas_v1]
key = "marineregions_goas_v1.zip"
doi = "10.14284/542"
extract = true
uri = "https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=MarineRegions:goas&outputFormat=SHAPE-ZIP"

[marineregions_eez_land_v4]
key = "marineregions_eez_land_v4.zip"
doi = "10.14284/698"
extract = true
uri = "https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=MarineRegions:eez_land&outputFormat=SHAPE-ZIP"

# HydroBASINS v1c (Lehner & Grill 2013), levels 1-12, the regions covering the NH
# domain: North America (na), Arctic (ar), Greenland (gr), Europe (eu), Siberia (si),
# Asia (as).

[hydrobasins_v1c_na]
key = "hydrobasins_v1c_na.zip"
extract = true
uri = "https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_na_lev01-12_v1c.zip"

[hydrobasins_v1c_ar]
