[adusumilli2020_melt]
doi = "10.6075/J04Q7SHT"
storage_path = "$datasets_dir/adusumilli2020/ANT_iceshelf_melt_rates_CS2_2010-2018_v0.h5"
uri = "https://library.ucsd.edu/dc/object/bb0448974g/_3_1.h5/download"

[adusumilli2020_height]
