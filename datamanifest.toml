# ICE-6G_D (VM5a) (Peltier et al., 2018), Antarctica, 122.5 ka to present: the files of the
# supporting information of the article, as copied in isostasy_data (key
# isostasy_data_v0_2, Solid Earth section below; see Peltier2018_ice6gd/README.md).

# PRISM4 / PlioMIP2 boundary conditions (Dowsett et al., 2016), USGS: enhanced and
# standard Pliocene, and modern (standard) for anomalies.

[prism4_plio_enh]
key = "prism4_plio_enh.zip"
doi = "10.5194/cp-12-1519-2016"
extract = true
uri = "https://geology.er.usgs.gov/egpsc/prism/data/Plio_enh.zip"

[prism4_plio_std]
key = "prism4_plio_std.zip"
doi = "10.5194/cp-12-1519-2016"
extract = true
uri = "https://geology.er.usgs.gov/egpsc/prism/data/Plio_std.zip"

[prism4_modern_std]
key = "prism4_modern_std.zip"
doi = "10.5194/cp-12-1519-2016"
extract = true
uri = "https://geology.er.usgs.gov/egpsc/prism/data/Modern_std.zip"

# Northern Hemisphere ice-sheet extents through the Quaternary (Batchelor et al., 2019):
# shapefiles of the best-estimate, minimum and maximum extents of 18 time slices. The
# whole OSF project (osf.io/7jen3) as one zip, made by OSF on request (250 MB, 30 min),
# which stalls too long for the automatic download: manual download and unzip into the
# folder (see Batchelor2019_NHIceMasks/README.md).

[batchelor2019_nh_ice]
doi = "10.1038/s41467-019-11601-2"
skip_download = true
storage_path = "$datasets_dir/batchelor2019_nh_ice"
uri = "https://files.osf.io/v1/resources/7jen3/providers/osfstorage/?zip="

# PaleoMIST 1.0 (Gowan et al., 2021), PANGAEA: global ice thickness and topography,
# 80-0 ka every 2.5 kyr (3.5 GB).

[gowan2021_paleomist]
key = "gowan2021_paleomist.zip"
doi = "10.1594/PANGAEA.905800"
extract = true
uri = "https://hs.pangaea.de/Maps/Global_Ice_Sheets/Gowan_ice_reconstruction.zip"

# PaleoGrIS 1.0 (Leger et al., 2024), Mendeley Data: the supplementary data in one zip
