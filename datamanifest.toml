storage_path = "$datasets_dir/dawson2022/Antarctica_Initialization.mat"
uri = "https://zenodo.org/records/6870567/files/Antarctica_Initialization.mat"

# ---------------------------------------------------------------------------
# Ocean (Ocean/)
# ---------------------------------------------------------------------------

# Schmidtko et al. (2014): Antarctic continental shelf bottom water, conservative
