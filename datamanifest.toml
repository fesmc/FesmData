# Original datasets used by FesmData workflows (read with DataManifest.jl).
#
# The data are stored outside the repository, under the folder given by the
# environment variable DATAMANIFEST_DATASETS_DIR (set per machine, see
# Topo/machines/*.env). Entries with `skip_download = true` need a manual download
# (e.g. a NASA Earthdata login) into their `storage_path`.

[bedmachine_antarctica_v4]
doi = "10.5067/POJQI54A45HX"
skip_download = true
storage_path = "$datasets_dir/bedmachine_antarctica_v4/NSIDC-0756_BedMachineAntarctica_19700101-20191001_V04.1.nc"
uri = "https://data.nsidc.earthdatacloud.nasa.gov/nsidc-cumulus-prod-protected/MEASURES/NSIDC-0756/4/1970/01/01/NSIDC-0756_BedMachineAntarctica_19700101-20191001_V04.1.nc"

