uri = "https://library.ucsd.edu/dc/object/bb0448974g/_2_1.h5/download"

# ---------------------------------------------------------------------------
# Basal state (BasalState/)
# ---------------------------------------------------------------------------

# Dawson et al. (2022): ISSM initialization of Antarctica (thermal steady state), a
# MATLAB 7.3 file with the ISSM model `md` (158 MB), Zenodo (CC BY 4.0).

[dawson2022_init]
