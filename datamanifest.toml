# Fox Maule et al. (2005), updated with the MF7 magnetic field model (M. Purucker, NASA
# GSFC, core2.gsfc.nasa.gov/research/purucker/heatflux_updates.html, offline): equal-area
# points (rings 1.5° apart) of Antarctica and Greenland, of the land north of 55°N, and
# the magnetic crustal thickness north of 55°N. From the Wayback Machine (identical to
# the copies in the old PIK archive, hpc:/data/sicopolis/data/GeothermalHeatFlux/).

[foxmaule2005_ghf]
doi = "10.1126/science.1106888"
