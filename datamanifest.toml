# ---------------------------------------------------------------------------
# Paleoclimate (Paleoclimate/)
# ---------------------------------------------------------------------------

# PMIP3 (CMIP5) lgm, midHolocene and piControl: output of the NCAR Climate Variability
# Diagnostics Package (CVDP v4.1.0) collected by the PMIP variability database
# (past2future.org, Brierley & Wainer, 2018), one cvdp_data file per model and experiment
# (PMIP3_cvdp/README.md). Not online any more: copied from the old PIK archive with
#   scp hpc:/data/sicopolis/data/PMIP3/all_PMIP_cvdp_data/data/<file> /work/ba1442/data/pmip3_cvdp/
# for the files listed in PMIP3_cvdp/prepare.jl.

[pmip3_cvdp]
doi = "10.5194/cp-14-1377-2018"
skip_download = true
storage_path = "$datasets_dir/pmip3_cvdp"
uri = "http://past2future.org/"

# PMIP3/CMIP5 LGM boundary conditions (v0, 2010; Abe-Ouchi et al., 2015): change of
# surface elevation (LGM - PI), land fraction and ice fraction on a 1° grid.

[pmip3_21k_orog_diff]
doi = "10.5194/gmd-8-3621-2015"
storage_path = "$datasets_dir/pmip3_21k_bc/pmip3_21k_orog_diff_v0.nc"
uri = "https://pmip3.lsce.ipsl.fr/share/design/ice_bc/pmip3_21k_orog_diff_v0.nc"

[pmip3_21k_sftlf]
doi = "10.5194/gmd-8-3621-2015"
storage_path = "$datasets_dir/pmip3_21k_bc/pmip3_21k_sftlf_v0.nc"
uri = "https://pmip3.lsce.ipsl.fr/share/design/ice_bc/pmip3_21k_sftlf_v0.nc"

[pmip3_21k_sftgif]
doi = "10.5194/gmd-8-3621-2015"
storage_path = "$datasets_dir/pmip3_21k_bc/pmip3_21k_sftgif_v0.nc"
uri = "https://pmip3.lsce.ipsl.fr/share/design/ice_bc/pmip3_21k_sftgif_v0.nc"

# Buizert et al. (2018): Greenland seasonal temperature reconstruction, 22 ka to present
# (NOAA NCEI paleo archive), and its 1981-2010 baseline climatology.

[buizert2018_recon]
doi = "10.25921/psvs-yg80"
storage_path = "$datasets_dir/buizert2018/GLand_22ka_recon_Buizert_20161228.nc"
uri = "https://www.ncei.noaa.gov/pub/data/paleo/reconstructions/buizert2018/GLand_22ka_recon_Buizert_20161228.nc"

[buizert2018_baseline]
doi = "10.25921/psvs-yg80"
storage_path = "$datasets_dir/buizert2018/GLand_1981-2010_baseline_12282016.nc"
uri = "https://www.ncei.noaa.gov/pub/data/paleo/reconstructions/buizert2018/GLand_1981-2010_baseline_12282016.nc"

# Badgeley et al. (2020): Greenland annual mean temperature and precipitation, 20 ka to
# present, from data assimilation (Arctic Data Center, CC0).

[badgeley2020_tas_main]
doi = "10.18739/A2599Z26M"
storage_path = "$datasets_dir/badgeley2020/tas_main_Badgeley_etal_2020.nc"
uri = "https://arcticdata.io/metacat/d1/mn/v2/object/urn:uuid:4a846c8d-5bd7-4e7c-a3c2-42be36ac0595"

[badgeley2020_pr_main]
doi = "10.18739/A2599Z26M"
storage_path = "$datasets_dir/badgeley2020/pr_main_Badgeley_etal_2020.nc"
uri = "https://arcticdata.io/metacat/d1/mn/v2/object/urn:uuid:6889d480-65c8-4b21-949e-7a1f81d18c42"

[badgeley2020_pr_low]
doi = "10.18739/A2599Z26M"
storage_path = "$datasets_dir/badgeley2020/pr_low_Badgeley_etal_2020.nc"
uri = "https://arcticdata.io/metacat/d1/mn/v2/object/urn:uuid:64b58bc8-0cf6-4e6b-95fd-7ee8d5e7d481"

[badgeley2020_pr_high]
doi = "10.18739/A2599Z26M"
storage_path = "$datasets_dir/badgeley2020/pr_high_Badgeley_etal_2020.nc"
uri = "https://arcticdata.io/metacat/d1/mn/v2/object/urn:uuid:c5e3fa59-7117-4fee-8163-07aae8519886"

# ---------------------------------------------------------------------------
# Solid Earth (SolidEarth/)
# ---------------------------------------------------------------------------

# Bagge et al. (2021): 18 global 3D viscosity structures for GIA models, Gaussian grid
# 256x512, GFZ Data Services (CC BY 4.0). The zip (1.7 GB) holds one NetCDF file per
# structure.

[bagge2021_visc]
key = "bagge2021_visc.zip"
doi = "10.5880/GFZ.1.3.2020.004"
extract = true
uri = "https://datapub.gfz.de/download/10.5880.GFZ.1.3.2020.004niur/2020-004_Bagge_et-al_data.zip"

# isostasy_data v0.2.0 (Swierczek-Jereczek, 2024): input data of FastIsostasy, archived on
# Zenodo (the GitHub repository JanJereczek/isostasy_data at that version). It holds the
# Earth structure of Pan et al. (2022) and the Antarctic viscosity of Wiens et al. (2022),
# not public elsewhere (obtained by personal communication), and the ice history of
# ICE-6G_D (Peltier et al., 2018) for Antarctica (Peltier2018_ice6gd, IceHistory), from the
# supporting information of the article, which Wiley does not let us download
# automatically. The zip extracts to JanJereczek-isostasy_data-<commit>/.

[isostasy_data_v0_2]
key = "isostasy_data_v0_2.zip"
doi = "10.5281/zenodo.11175418"
extract = true
uri = "https://zenodo.org/records/11175418/files/JanJereczek/isostasy_data-v0.2.0.zip"

# Lloyd et al. (2024): 3D mantle viscosity inferred from GLAD-M25, 0.5°, 201 depths, in
# the supporting information of the article (CC BY 4.0). Manual download (Europe PMC
# assembles the zip for minutes before sending it, longer than DataManifest waits): the
# zip from the uri holds ggad455_supplemental_files.zip, to be put in the folder
# (see Lloyd2024_visc/README.md); prepare.jl extracts 3D_visc_infer_GLAD-M25.nc from it.

[lloyd2024_visc]
doi = "10.1093/gji/ggad455"
skip_download = true
storage_path = "$datasets_dir/lloyd2024_visc"
uri = "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10753356/supplementaryFiles"

# Hazzard et al. (2023): Antarctic viscosity, temperature, density, LAB depth and heat
# flow from ANT-20 (mean and standard deviation of the posterior ensemble), 0.5°
# (OSF project f4ntr, summary_grids.zip; no licence set on OSF).

[hazzard2023_visc]
key = "hazzard2023_visc.zip"
doi = "10.1029/2023JB026653"
extract = true
uri = "https://osf.io/download/j485x/"
# Ice cores (IceCores/)
# ---------------------------------------------------------------------------

# Kindler et al. (2014): NGRIP temperature and accumulation reconstruction, 10-120 kyr
# b2k, and d15N data (supplement of the Clim. Past article, one xlsx file).

[kindler2014_ngrip]
key = "kindler2014_ngrip.zip"
doi = "10.5194/cp-10-887-2014"
extract = true
uri = "https://cp.copernicus.org/articles/10/887/2014/cp-10-887-2014-supplement.zip"

# Gkinis et al. (2020): NEEM high-resolution (0.05 m) water isotopes, 8-129 ka b2k,
# PANGAEA tab-delimited text (CC BY 4.0).

[gkinis2020_neem]
doi = "10.1594/PANGAEA.925552"
storage_path = "$datasets_dir/gkinis2020_neem/NEEM_Gkinis2020.tab"
