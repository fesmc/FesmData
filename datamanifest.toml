# ---------------------------------------------------------------------------
# Sediment thickness (Sediment/)
# ---------------------------------------------------------------------------

# CRUST1.0 (Laske et al., 2013): 1x1° global crustal model; crust1.bnds holds the
# boundaries of its layers, among them three sediment layers.

[crust1]
key = "crust1.tar.gz"
extract = true
uri = "https://igppweb.ucsd.edu/~gabi/crust1/crust1.0.tar.gz"

# GlobSed v3 (Straume et al., 2019): 5 arc-min total sediment thickness of the oceans,
# archived at PANGAEA after the NCEI page was retired (also at CaltechDATA,
# doi:10.22002/k4070-ngc79). GlobSed.zip holds GlobSed-v3.nc, GlobSed-v3.xyz and an
# ArcGIS ascii grid.

[globsed_v3]
key = "globsed_v3.zip"
doi = "10.1594/PANGAEA.982339"
extract = true
uri = "https://download.pangaea.de/dataset/982339/files/GlobSed.zip"

# ECM1 (Mooney et al., 2023): 1x1° global crustal model. ECM1_Sediments.zip ("Sediment
# Model" on the web site) holds Sed_ECM1.txt, the total sediment thickness and the
# thickness of its three layers.

[ecm1_sediments]
