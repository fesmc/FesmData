    "https://www.physics.mun.ca/~lev/GLAC1Dnn9894NAGrB120kto30k.nc",
    "https://www.physics.mun.ca/~lev/GLAC1Dnn9894NAGrB30kto0k.nc",
    "https://www.physics.mun.ca/~lev/GLAC1Dnn4041ANT120kto30k.nc",
    "https://www.physics.mun.ca/~lev/GLAC1Dnn4041ANT30kto0k.nc",
]

