# isostasy_data v0.2.0 (Swierczek-Jereczek, 2024): input data of FastIsostasy, archived on
# Zenodo (the GitHub repository JanJereczek/isostasy_data at that version). It holds the
# Earth structure of Pan et al. (2022) and the Antarctic viscosity of Wiens et al. (2022),
# not public elsewhere (obtained by personal communication), and the ice history of
# ICE-6G_D (Peltier et al., 2018) for Antarctica (Peltier2018_ice6gd, IceHistory), from the
# supporting information of the article, which Wiley does not let us download
