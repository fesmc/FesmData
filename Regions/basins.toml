# Basin sets of the regions v2 masks (see README.md).
#
# Each set is written as <GRID>_BASINS-<name>.nc on all grids of its `domains`. The
# basins are rasterized on the base grid and then extended, within `region` (a region
# path of regions.toml), over the rest of the land and the continental shelf up to
# the shelf break (zones land and shelf, see regions.toml [zone]): each such cell gets
# the nearest basin along paths through these cells. `basin_mask` marks the original
# extent of the basins.
#
#   source      - polygon source (see sources.jl), or glacier outlines of IceBoost v2
#                 (`iceboost_v2_rgiNN`, the footprints of its thickness tiles, with
#                 the RGI 7.0 id as id_field "rgi_id")
#   id_field    - attribute identifying a basin: integers are used as basin ids;
#                 names are numbered 1, 2, ... in alphabetical order
#   features    - optional values of id_field: only these basins (needed for glaciers)
#   group_field - optional attribute grouping the basins (e.g. into regions), written
#                 as basin_group (numbered like id_field); "zwally_system" groups
#                 Zwally sub-systems (e.g. 11 = 1.1) by their major system (1)
#   no_extension - optional basins (values of id_field) that keep their original
#                 extent but are not extended (e.g. islands in ice shelves, which
#                 would otherwise take over the ice shelves around them)
#
# The NEGIS sets (sources "negis" and "negis_v1", see negis.jl) are rasters of three
# parts, basin 1 2 3 = centre south north, not extended (basin_mask = basin != 0); they
# have no id_field, and "negis" takes its parameters from the table [basins.negis].

[[basins]]
name = "Mouginot2019"
domains = ["GRL-PAL", "NH"]
region = "1.3"
source = "mouginot2019"
id_field = "NAME"
group_field = "SUBREGION1"

[[basins]]
name = "Zwally2012"
domains = ["GRL-PAL", "NH"]
region = "1.3"
source = "zwally2012_greenland"
id_field = "basin"
group_field = "zwally_system"

[[basins]]
name = "IMBIE2016"
domains = ["ANT"]
region = "2.1"
source = "imbie"
id_field = "NAME"
group_field = "Regions"

[[basins]]
name = "IMBIE2016-refined"
domains = ["ANT"]
region = "2.1"
source = "imbie_refined"
id_field = "NAME"
group_field = "Regions"
no_extension = ["Islands"]

[[basins]]
name = "Zwally2012"
domains = ["ANT"]
region = "2.1"
source = "zwally2012_antarctica"
id_field = "basin"

# San Rafael Glacier: the part of the SRG domain that evolves freely in yelmox, the rest
# relaxing to the present-day state (v1: SRG-250M_REGIONS.nc, regions = 1). Its RGI 7.0
# outline (684.6 km2); not extended.
[[basins]]
name = "SanRafael"
domains = ["SRG"]
region = "2.2"
source = "iceboost_v2_rgi17"
id_field = "rgi_id"
features = ["RGI2000-v7.0-G-17-12835"]
no_extension = ["RGI2000-v7.0-G-17-12835"]

# Northeast Greenland Ice Stream in three parts (centre, south, north), to tune basal
# friction by part in yelmox.
#
# NEGIS-v1: the v1 parts, drawn by hand by Ilaria Tabone (2024) on GRL-16KM
# (sources/negis_v1_GRL-16KM.csv); each cell takes the part of the GRL-16KM cell
# containing its centre, so GRL-16KM reproduces v1 exactly.
[[basins]]
name = "NEGIS-v1"
domains = ["GRL-PAL"]
region = "1.3"
source = "negis_v1"

# NEGIS: centre and south from the present-day surface speed (NSIDC-0670, Joughin et al.,
# 2018), north from the v1 north part, a palaeo ice stream (Franke et al., 2022) that
# today's velocities do not show. The stream is the cells of Zwally drainage system
# `zwally_system` with grounded ice (topography of the zones) and speed of at least
# `speed` (m/yr), or `speed_south` south of the cut, connected to the cell nearest to
# `seed` (x, y in km; in the trunk of 79N); this leaves out the fast cells of
# Storstrommen and L. Bistrup Brae. South is the stream south of the cut line
# y = cut_y0 + cut_slope * x (km, GRL polar stereographic), centre the rest; the north
# part replaces them where they overlap. The values give the best match of the v1 parts
# on GRL-16KM (see README.md).
[[basins]]
name = "NEGIS"
domains = ["GRL-PAL"]
region = "1.3"
source = "negis"

[basins.negis]
zwally_system = 2
seed = [400.0, -1162.0]
speed = 50.0
speed_south = 30.0
cut_y0 = -1140.0
cut_slope = -0.3
