# Basin sets of the regions v2 masks (see README.md).
#
# Each set is written as <GRID>_BASINS-<name>.nc on all grids of its `domains`. The
# basins are rasterized on the base grid and then extended, within `region` (a region
# path of regions.toml), over the rest of the land and the continental shelf up to
# the shelf break (zones land and shelf, see regions.toml [zone]): each such cell gets
# the nearest basin along paths through these cells. `basin_mask` marks the original
# extent of the basins.
#
#   source      - polygon source (see sources.jl)
#   id_field    - attribute identifying a basin: integers are used as basin ids;
#                 names are numbered 1, 2, ... in alphabetical order
#   group_field - optional attribute grouping the basins (e.g. into regions), written
#                 as basin_group (numbered like id_field); "zwally_system" groups
#                 Zwally sub-systems (e.g. 11 = 1.1) by their major system (1)

[[basins]]
name = "Mouginot2019"
domains = ["GRL-PAL", "NH"]
region = "1.3"
source = "mouginot2019"
id_field = "NAME"
group_field = "SUBREGION1"

[[basins]]
name = "Zwally2012"
domains = ["GRL-PAL", "NH"]
region = "1.3"
source = "zwally2012_greenland"
id_field = "basin"
group_field = "zwally_system"

[[basins]]
name = "IMBIE2016"
domains = ["ANT"]
region = "2.1"
source = "imbie"
id_field = "NAME"
group_field = "Regions"

[[basins]]
name = "IMBIE2016-refined"
domains = ["ANT"]
region = "2.1"
source = "imbie_refined"
id_field = "NAME"
group_field = "Regions"

[[basins]]
name = "Zwally2012"
domains = ["ANT"]
region = "2.1"
source = "zwally2012_antarctica"
id_field = "basin"
