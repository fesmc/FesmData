# Geothermal heat flow (thematic dataset, see ../Remap/README.md).
#
# Each table of `products` is a product, written as <GRID>_GHF-<name>.nc on every grid
# of its `domains` (output folders), from the prepared file `file` of the source
# `source` (made by <source>/prepare.jl in $FESMDATA_WORK/prepared/<source>/).
# `variables` are the fields remapped (default: all), `method` the remapping ("con" or
# "bilinear", default "con") and `smooth` the Gaussian smoothing after it ("auto" or a
# standard deviation in km, default "auto"). The dataset and its release tag are in
# ../Publish/datasets.toml.

[products.Lucazeau2019]
source = "Lucazeau2019_ghf"
file = "Lucazeau2019_GHF.nc"
variables = ["ghf", "ghf_sd"]
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]

[products.Martos2017]
source = "Martos2017_ghf"
file = "Martos2017_GHF.nc"
variables = ["ghf", "ghf_sd", "depth_curie", "depth_curie_sd"]
domains = ["Antarctica"]

[products.Martos2018]
source = "Martos2018_ghf"
file = "Martos2018_GHF.nc"
variables = ["ghf", "ghf_sd", "depth_curie", "depth_curie_sd"]
domains = ["Greenland"]

[products.HazzardRichards2024]
source = "HazzardRichards2024_ghf"
file = "HazzardRichards2024_GHF.nc"
variables = ["ghf", "ghf_sd"]
domains = ["Antarctica"]

[products.Davies2013]
source = "Davies2013_ghf"
file = "Davies2013_GHF.nc"
variables = ["ghf", "ghf_median", "ghf_err"]
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]

[products.Shapiro2004]
source = "Shapiro2004_ghf"
file = "Shapiro2004_GHF.nc"
variables = ["ghf", "ghf_sd"]
domains = ["Antarctica", "GreenlandPaleo", "Greenland", "North", "Laurentide", "Eurasia", "Global"]
