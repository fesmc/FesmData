# Geothermal heat flow (thematic dataset, see ../Remap/README.md).
#
# Each table of `products` is a product, written as <GRID>_GHF-<name>.nc on its `grids`
# (by domain), from the prepared file `file` of the source `source` (made by
# <source>/prepare.jl in $FESMDATA_WORK/prepared/<source>/), or several combined (a list).
# `variables` are the fields remapped (default: all), `method` the remapping ("con" or
# "bilinear", default "con"), `smooth` the Gaussian smoothing after it ("auto" or a
# standard deviation in km, default "auto"). `grids` gives the grids by domain (output
# folder): a minimum spacing in km (the standard grids of the domain not finer than
# this, 0: all), or a list of grid names; the product is not made on domains not
# listed. `release = false` leaves a product out of the releases, `figure` sets its
# figure on the website (see ../Figures/README.md), and `fill` fills the gaps over the
# ice (see ../Remap/README.md). The dataset and its release tag are
# in ../Publish/datasets.toml.

[products.Lucazeau2019]
source = "Lucazeau2019_ghf"
file = "Lucazeau2019_GHF.nc"
variables = ["ghf", "ghf_sd"]
grids = { Antarctica = 4, GreenlandPaleo = 4, Greenland = 4, North = 4, Laurentide = 4, Eurasia = 4, Global = 4 }

[products.Martos2017]
source = "Martos2017_ghf"
file = "Martos2017_GHF.nc"
variables = ["ghf", "ghf_sd", "depth_curie", "depth_curie_sd"]
grids = { Antarctica = 4 }

[products.Martos2018]
source = "Martos2018_ghf"
