# Datasets released by Publish (see README.md): one record per dataset and domain (the
# output folder under $ICE_DATA/v2, e.g. Greenland). `tag` is the dataset name of the
# provenance attributes and release tags (<tag>-vX.Y.Z). The files of a release on each
# grid are defined by the pipeline (e.g. topo_release_files in ../Topo/files.jl), with
# the grid files grid_<GRID>.txt and <GRID>_grid.nc.

# Store of the releases: the package registry of a GitLab project
[_gitlab]
url = "https://gitlab.dkrz.de"
project = "fesmc/fesmdata-products"

# Metadata of the records archived on Zenodo
[_zenodo]
community = "fesmc"
license = "cc-by-4.0"
creators = [
    { name = "Robinson, Alexander", affiliation = "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research", orcid = "0000-0003-3519-5293" },
]

[Topo]
tag = "topo"
title = "high-resolution topography"
readme = "Topo/README.md"
keywords = ["topography", "bathymetry", "ice thickness", "ice sheet", "model input"]
description = """
Bed topography, surface elevation, ice thickness and ice/ocean area fractions on the
grids of a model domain, from the base grid to 32 km. Each source is remapped
conservatively onto the base grid, the sources are merged in order of priority, and
the coarser grids are derived from the base grid by conservative remapping.
"""

[Regions]
tag = "regions"
title = "regions and ice-sheet basins"
readme = "Regions/README.md"
keywords = ["regions", "drainage basins", "continental shelf", "ice sheet", "model input"]
description = """
Region codes (a hierarchy of hemispheres, continents, ice sheets and oceans), zones
(open ocean, continental shelf, land) with the distance to the shelf break, and
ice-sheet drainage basins extended to the shelf break, on the grids of a model domain.
"""
