# Datasets released by Publish (see README.md): one record per dataset and domain (the
# output folder under $FESMDATA_PRODUCTS, e.g. Greenland). `tag` is the dataset name of the
# provenance attributes and release tags (<tag>-vX.Y.Z). The files of a release on each
# grid are defined by the pipeline (e.g. topo_release_files in ../Topo/files.jl, or
# <Dataset>/remap.toml for a thematic dataset), with the grid files grid_<GRID>.txt and
# <GRID>_grid.nc.

# Store of the releases: the package registry of a GitLab project (Helmholtz Codebase)
[_gitlab]
url = "https://codebase.helmholtz.cloud"
project = "fesmc/fesmdata-products"

# Metadata of the records archived on Zenodo
[_zenodo]
community = "fesmc"
license = "cc-by-4.0"
creators = [
    { name = "Robinson, Alexander", affiliation = "Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research", orcid = "0000-0003-3519-5293" },
]

# Topics of the datasets on the website (overview pages and products page), in order
[_site]
topics = [
    { name = "Topography and masks", datasets = ["Topo", "Regions"] },
    { name = "Ice", datasets = ["Velocity", "IceChange", "IceHistory", "Stratigraphy", "BasalMelt", "BasalState"] },
    { name = "Solid Earth", datasets = ["GHF", "Sediment", "SolidEarth"] },
    { name = "Ocean and climate", datasets = ["Ocean", "SMB", "Atmosphere", "Paleoclimate"] },
    { name = "Records", datasets = ["IceCores", "GHG", "SeaLevel", "RSL", "Boreholes", "GPS", "SMBObs", "Freshwater"] },
]

[Topo]
tag = "topo"
title = "high-resolution topography"
readme = "Topo/README.md"
keywords = ["topography", "bathymetry", "ice thickness", "ice sheet", "model input"]
description = """
Bed topography, surface elevation, ice thickness and ice/ocean area fractions on the
grids of a model domain, from the base grid to 32 km. Each source is remapped
conservatively onto the base grid, the sources are merged in order of priority, and
the coarser grids are derived from the base grid by conservative remapping.
"""

[Regions]
tag = "regions"
title = "regions and ice-sheet basins"
readme = "Regions/README.md"
keywords = ["regions", "drainage basins", "continental shelf", "ice sheet", "model input"]
description = """
Region codes (a hierarchy of hemispheres, continents, ice sheets and oceans), zones
(open ocean, continental shelf, land) with the distance to the shelf break,
ice-sheet drainage basins extended to the shelf break, and masks of the nests and crops,
on the grids of a model domain.
"""

[GHF]
tag = "ghf"
title = "geothermal heat flow"
readme = "GHF/README.md"
keywords = ["geothermal heat flow", "ice sheet", "model input"]
description = """
Geothermal heat flow from published maps, remapped conservatively onto the grids of a
model domain (and smoothed on grids finer than the map), or onto global lon-lat grids.
"""

[Sediment]
tag = "sediment"
title = "sediment thickness and properties"
readme = "Sediment/README.md"
keywords = ["sediment thickness", "sediment properties", "ice sheet", "model input"]
description = """
Sediment thickness from global and regional maps, and the surface sediment properties
of North America and Greenland (grain size and distribution classes), remapped
conservatively onto the grids of a model domain (and smoothed on grids finer than the
map), or onto global lon-lat grids.
"""

[IceHistory]
tag = "icehistory"
title = "paleo ice sheets and topography"
readme = "IceHistory/README.md"
keywords = ["ice sheet reconstruction", "paleotopography", "glacial cycles", "Pliocene", "model input"]
description = """
Reconstructions of past ice sheets and topography (ICE-5G, ICE-6G_C, ICE-6G_D,
PaleoMIST, PRISM4), ice extents (Batchelor et al., 2019, and a last-glacial-cycle
combination with PaleoMIST), the deglaciation of Greenland (PaleoGrIS) and the ice
streams of the Laurentide ice sheet, remapped conservatively onto the grids of a model
domain, or onto global lon-lat grids.
"""

[Stratigraphy]
tag = "stratigraphy"
title = "age structure of the ice"
readme = "Stratigraphy/README.md"
keywords = ["radiostratigraphy", "ice age", "isochrones", "Greenland", "model validation"]
description = """
Age structure of the ice from radar stratigraphy (ice age at normalized depths and depth
of isochrones), remapped conservatively onto the grids of a model domain.
"""

[BasalMelt]
tag = "basalmelt"
title = "ice-shelf basal melt rates and height changes"
readme = "BasalMelt/README.md"
keywords = ["basal melt", "ice shelves", "height change", "Antarctica", "model input", "model validation"]
description = """
Basal melt rates of ice shelves from observations, and the time series of ice-shelf
height change from satellite altimetry they are derived from, remapped conservatively
onto the grids of a model domain.
"""

[BasalState]
tag = "basalstate"
title = "basal thermal state of the ice sheets"
readme = "BasalState/README.md"
keywords = ["basal temperature", "basal thermal state", "frozen bed", "thawed bed", "Antarctica", "model validation"]
description = """
Basal temperature and basal thermal state (frozen, thawable, thawed) of the ice sheets
from models, remapped onto the grids of a model domain.
"""

[Ocean]
tag = "ocean"
title = "ocean temperature and salinity"
readme = "Ocean/README.md"
keywords = ["ocean temperature", "salinity", "continental shelf", "model input"]
description = """
Ocean temperature and salinity from observations and reanalyses, remapped
conservatively onto the grids of a model domain, or onto global lon-lat grids.
"""

[Velocity]
tag = "velocity"
title = "ice surface velocity"
readme = "Velocity/README.md"
keywords = ["ice velocity", "ice sheet", "remote sensing", "model validation"]
description = """
Surface velocity of the ice sheets from satellite observations, remapped conservatively
onto the grids of a model domain, with the components along the grid axes.
"""

[IceChange]
tag = "icechange"
title = "observed recent change of the ice sheets"
readme = "IceChange/README.md"
keywords = ["elevation change", "thickness change", "ICESat-2", "altimetry", "ice sheet", "model validation"]
description = """
Observed recent change of the ice sheets of Antarctica and Greenland: surface elevation
and ice thickness change rates from satellite laser altimetry (ICESat-2, and ICESat to
ICESat-2), remapped conservatively onto the grids of a model domain.
"""

[SMB]
tag = "smb"
title = "surface mass balance and surface climate"
readme = "SMB/README.md"
keywords = ["surface mass balance", "regional climate model", "ice sheet", "model input"]
description = """
Surface mass balance and surface climate of the ice sheets from regional climate models
(RACMO, MAR), remapped conservatively onto the grids of a model domain.
"""

[Atmosphere]
tag = "atmosphere"
title = "atmospheric climatologies"
readme = "Atmosphere/README.md"
keywords = ["reanalysis", "ERA5", "CERES", "climatology", "model input", "model validation"]
description = """
Monthly climatologies of the atmosphere from reanalysis (ERA5) and satellite (CERES)
data, remapped conservatively onto the grids of a model domain, or onto global lon-lat
grids.
"""

[Paleoclimate]
tag = "paleoclimate"
title = "simulations and reconstructions of past climates"
readme = "Paleoclimate/README.md"
keywords = ["paleoclimate", "PMIP", "Last Glacial Maximum", "Holocene", "deglaciation", "model input"]
description = """
Climatologies of past climates from the PMIP3 and PMIP4 model intercomparisons, and
reconstructions of the deglacial climate of Greenland, remapped conservatively onto the
grids of a model domain, or onto global lon-lat grids.
"""

[SolidEarth]
tag = "solidearth"
title = "solid Earth structure"
readme = "SolidEarth/README.md"
keywords = ["lithosphere thickness", "mantle viscosity", "glacial isostatic adjustment", "ice sheet", "model input"]
description = """
Lithosphere thickness and 3D mantle viscosity (log10, on depth) from published Earth
structures for glacial isostatic adjustment, remapped conservatively onto the grids of
a model domain, or onto global lon-lat grids.
"""

# Records datasets (non-gridded, see Records/README.md): released on the domain Records

[IceCores]
tag = "icecores"
title = "ice core records"
readme = "IceCores/README.md"
keywords = ["ice core", "paleoclimate", "Antarctica", "Greenland", "temperature", "water isotopes", "dust", "chronology", "surface elevation"]
description = """
Time series at Antarctic and Greenland ice core sites over glacial cycles: water isotopes
and temperatures of EPICA Dome C, Vostok, Dome Fuji, EDML and TALDICE, the synchronized
Greenland δ18O and calcium records of NGRIP, GRIP and GISP2, seasonal temperatures at
Greenland sites (Buizert et al., 2018), NGRIP temperature and accumulation (Kindler et
al., 2014), NEEM water isotopes (Gkinis et al., 2020), Holocene surface elevation changes
(Vinther et al., 2009), EPICA Dome C dust flux, and the AICC2023 chronology of five cores,
as CF discrete sampling geometry files with text copies.
"""

[GHG]
tag = "ghg"
title = "greenhouse gases from ice cores"
readme = "GHG/README.md"
keywords = ["greenhouse gases", "CO2", "methane", "nitrous oxide", "ice core", "radiative forcing", "glacial cycles"]
description = """
Atmospheric CO2, CH4 and N2O over glacial cycles from Antarctic ice cores: the revised
CO2 composite (Bereiter et al., 2015), EPICA Dome C methane (Loulergue et al., 2008) and
nitrous oxide (Schilt et al., 2010), and the spline-smoothed series of the last 156 kyr
with their radiative forcing (Köhler et al., 2017), as CF discrete sampling geometry
files with text copies.
"""

[SeaLevel]
tag = "sealevel"
title = "global sea level over glacial cycles"
readme = "SeaLevel/README.md"
keywords = ["sea level", "ice volume", "glacial cycles", "benthic d18O", "Pleistocene", "Pliocene"]
description = """
Reconstructions of global sea level over glacial cycles, some with the contributions of
the ice sheets: the stacks of Spratt and Lisiecki (2016), Waelbroeck et al. (2002),
Bintanja and van de Wal (2008), de Boer et al. (2014), Berends et al. (2021), Rohling et
al. (2021), the Red Sea record of Grant et al. (2014) and the ice sheets of PaleoMIST 1.0
(Gowan et al., 2021), as CF discrete sampling geometry files with text copies.
"""

[RSL]
tag = "rsl"
title = "relative sea level indicators"
readme = "RSL/README.md"
keywords = ["relative sea level", "sea-level indicators", "glacial isostatic adjustment", "Greenland"]
description = """
Dated relative sea level indicators of Greenland (index points and limiting data) from
GAPSLIP 2.1 (Gowan, 2023), one observation per sample.
"""

[Boreholes]
tag = "boreholes"
title = "ice temperature profiles"
readme = "Boreholes/README.md"
keywords = ["borehole", "ice temperature", "Greenland", "Canadian Arctic", "model evaluation"]
description = """
Temperature profiles of 95 boreholes in Greenland and the Canadian Arctic (Løkkegaard et
al., 2023) on a common 1 m depth axis, with their metadata.
"""

[GPS]
tag = "gps"
title = "GPS vertical velocities"
readme = "GPS/README.md"
keywords = ["GPS", "vertical land motion", "glacial isostatic adjustment", "uplift rates"]
description = """
Vertical velocities of about 4000 GPS stations corrected for non-GIA effects, as
observational estimates of GIA uplift rates (Schumacher et al., 2018).
"""

[SMBObs]
tag = "smbobs"
title = "surface mass balance observations"
readme = "SMBObs/README.md"
keywords = ["surface mass balance", "SUMup", "Greenland", "Antarctica", "model evaluation"]
description = """
Surface mass balance measurements of Greenland and Antarctica from SUMup 2025 (Vandecrux
et al., 2025), as mean rates and totals over the measurement intervals.
"""

[Freshwater]
tag = "freshwater"
title = "freshwater fluxes of the ice sheets"
readme = "Freshwater/README.md"
keywords = ["freshwater", "discharge", "runoff", "calving", "ice shelf melt", "Greenland", "Antarctica"]
description = """
Freshwater flux and mass anomaly series of the Greenland and Antarctic ice sheets by
region (Schmidt et al., 2025), with the regions as basin ids of the Regions basin set
Schmidt2025.
"""
