# Ice surface velocity (thematic dataset, see ../Remap/README.md). Products are written
# as <GRID>_Velocity-<name>.nc on their `grids`; see ../GHF/remap.toml
# for the options. The dataset and its release tag are in ../Publish/datasets.toml.
# The velocity components are prepared eastward and northward, and rotated to the axes
# of the grids by remap.

[products.Joughin2018]
source = "Joughin2018"
file = "Joughin2018_VEL.nc"
grids = { Greenland = 0 }

[products.Rignot2011]
source = "Rignot2011_vel"
file = "Rignot2011_VEL.nc"
grids = { Antarctica = 0 }
